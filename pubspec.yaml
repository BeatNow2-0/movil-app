name: BeatNow
description: "BeatNow mobile app for discovering beats, saving favorites and writing lyrics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  http: ^1.2.1
  audioplayers: ^6.0.0
  image_picker: ^1.2.1
  firebase_core: ^4.2.1
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.3
  http_parser: ^4.1.2
  regexed_validator: ^2.0.0+1
  pin_code_fields: ^8.0.1
  share_plus: ^12.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/images/profile.jpg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
